<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JARVIS</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at center, #07151d 0%, #020509 55%, #000 100%);
  color: #8eeaff;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

.interface {
  width: 92%;
  max-width: 700px;
  text-align: center;
}

.title {
  font-size: 42px;
  letter-spacing: 12px;
  text-shadow: 0 0 20px #8eeaff;
}

.status {
  margin-top: 10px;
  font-size: 13px;
  letter-spacing: 4px;
  opacity: .7;
}

.core {
  width: 230px;
  height: 230px;
  margin: 50px auto 35px;
  border-radius: 50%;
  border: 2px solid #8eeaff;

  display: flex;
  justify-content: center;
  align-items: center;

  box-shadow:
    0 0 20px #8eeaff,
    0 0 70px rgba(142,234,255,.35),
    inset 0 0 40px rgba(142,234,255,.2);

  animation: pulse 2s infinite;
}

.core::before {
  content: "";
  width: 125px;
  height: 125px;
  border-radius: 50%;
  border: 2px solid #8eeaff;

  box-shadow:
    0 0 20px #8eeaff,
    inset 0 0 25px rgba(142,234,255,.3);
}

@keyframes pulse {

  0%,100% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.05);
  }

}

.message {
  min-height: 60px;
  margin: 20px auto;
  font-size: 18px;
  line-height: 1.5;
}

button {

  background: transparent;
  color: #8eeaff;

  border: 1px solid #8eeaff;

  padding: 14px 28px;
  margin: 7px;

  border-radius: 30px;

  font-size: 14px;
  letter-spacing: 2px;

  box-shadow:
    0 0 15px rgba(142,234,255,.2);

}

button:active {
  transform: scale(.95);
}

</style>
</head>

<body>

<div class="interface">

  <div class="title">
    JARVIS
  </div>

  <div class="status" id="status">
    SYSTEM READY
  </div>

  <div class="core"></div>

  <div class="message" id="message">
    Esperando instrucciones.
  </div>

  <button onclick="listen()">
    🎙️ HABLAR
  </button>

  <button onclick="activate()">
    ACTIVAR
  </button>

</div>


<script>

const MEMORY_KEY = "jarvis_memory";


/* =========================
   VOZ
========================= */

function speak(text) {

  const voice =
    new SpeechSynthesisUtterance(text);

  voice.lang = "es-MX";
  voice.rate = 0.92;
  voice.pitch = 0.9;

  speechSynthesis.cancel();
  speechSynthesis.speak(voice);

}


/* =========================
   PANTALLA
========================= */

function show(text) {

  document.getElementById("message")
    .textContent = text;

}


function status(text) {

  document.getElementById("status")
    .textContent = text;

}


/* =========================
   MEMORIA
========================= */

function getMemory() {

  try {

    return JSON.parse(
      localStorage.getItem(MEMORY_KEY)
    ) || {};

  } catch {

    return {};

  }

}


function saveMemory(memory) {

  localStorage.setItem(
    MEMORY_KEY,
    JSON.stringify(memory)
  );

}


function remember(command) {

  const memory =
    getMemory();

  const patterns = [

    "recuerda que ",
    "recuerda ",
    "memoriza ",
    "guarda que ",
    "guarda "

  ];

  let information = "";

  for (const pattern of patterns) {

    if (command.startsWith(pattern)) {

      information =
        command.substring(pattern.length).trim();

      break;

    }

  }


  if (!information) {

    return null;

  }


  const id =
    "memoria_" +
    Date.now();

  memory[id] =
    information;

  saveMemory(memory);


  return "Entendido, señor. Lo recordaré.";

}


function recallMemory() {

  const memory =
    getMemory();

  const items =
    Object.values(memory);


  if (items.length === 0) {

    return "Todavía no tengo recuerdos guardados, señor.";

  }


  return "Recuerdo lo siguiente, señor: " +
    items.join(". ");

}


/* =========================
   PERSONALIDAD
========================= */

function personality(command) {

  if (
    command.includes("cómo estás") ||
    command.includes("como estas")
  ) {

    return "Funcionando perfectamente, señor. Gracias por preguntar.";

  }


  if (
    command.includes("gracias")
  ) {

    return "Siempre a su servicio, señor.";

  }


  if (
    command.includes("buenos días") ||
    command.includes("buenos dias")
  ) {

    return "Buenos días, señor. Todos los sistemas están preparados.";

  }


  if (
    command.includes("buenas noches")
  ) {

    return "Buenas noches, señor. El sistema permanece disponible.";

  }


  return null;

}


/* =========================
   ACTIVACIÓN
========================= */

function activate() {

  status("SYSTEM ONLINE");

  const answer =
    "Todos los sistemas funcionando, señor. " +
    "Estoy listo para ayudarle.";

  show(answer);

  speak(answer);

}


/* =========================
   RESPUESTAS
========================= */

function respond(command) {

  command =
    command.toLowerCase().trim();


  /* MEMORIA */

  const saved =
    remember(command);

  if (saved) {

    return saved;

  }


  /* RECORDAR */

  if (
    command.includes("qué recuerdas") ||
    command.includes("que recuerdas") ||
    command.includes("qué recuerdas de mí") ||
    command.includes("que recuerdas de mi")
  ) {

    return recallMemory();

  }


  /* PERSONALIDAD */

  const personalityAnswer =
    personality(command);

  if (personalityAnswer) {

    return personalityAnswer;

  }


  /* SALUDO */

  if (
    command.includes("hola") ||
    command.includes("buenas")
  ) {

    return "Buenas, señor. Me alegra escucharlo. Estoy listo.";

  }


  /* IDENTIDAD */

  if (
    command.includes("quién eres") ||
    command.includes("quien eres")
  ) {

    return "Soy JARVIS, su asistente virtual personal, señor.";

  }


  /* CAPACIDADES */

  if (
    command.includes("qué puedes hacer") ||
    command.includes("que puedes hacer")
  ) {

    return "Puedo escucharlo, responder comandos, recordar información y ayudarle a controlar nuevas funciones que iremos añadiendo, señor.";

  }


  /* HORA */

  if (
    command.includes("hora")
  ) {

    const now =
      new Date();

    return "Son las " +
      now.toLocaleTimeString(
        "es-MX",
        {
          hour: "numeric",
          minute: "2-digit"
        }
      ) +
      ", señor.";

  }


  /* ESTADO */

  if (
    command.includes("estado") ||
    command.includes("sistema")
  ) {

    return "Todos los sistemas están funcionando correctamente, señor.";

  }


  /* ACTIVAR */

  if (
    command.includes("activa") ||
    command.includes("activar")
  ) {

    return "Sistema activado, señor. Todos los módulos están preparados.";

  }


  /* RESPUESTA GENERAL */

  return "He recibido su instrucción, señor. Aún estoy aprendiendo, pero cada nueva función ampliará mis capacidades.";

}


/* =========================
   RECONOCIMIENTO DE VOZ
========================= */

function listen() {

  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!Recognition) {

    show(
      "El reconocimiento de voz no está disponible, señor."
    );

    return;

  }


  const recognition =
    new Recognition();


  recognition.lang =
    "es-MX";

  recognition.continuous =
    false;

  recognition.interimResults =
    false;


  status("ESCUCHANDO...");

  show("Lo escucho, señor.");


  recognition.start();


  recognition.onresult =
    function(event) {

      const command =
        event.results[0][0].transcript;


      status("PROCESANDO...");


      const answer =
        respond(command);


      show(answer);


      setTimeout(
        function() {

          status("SYSTEM ONLINE");

          speak(answer);

        },
        300
      );

    };


  recognition.onerror =
    function() {

      status("SYSTEM ONLINE");

      show(
        "No pude escucharlo, señor. Inténtelo nuevamente."
      );

    };

}

</script>

</body>
</html>

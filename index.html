<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JARVIS</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;

  background:
    radial-gradient(
      circle at center,
      #0a1c26 0%,
      #03080c 55%,
      #000 100%
    );

  color: #8eeaff;

  font-family:
    Arial,
    sans-serif;

  display: flex;
  justify-content: center;
  align-items: center;

  overflow: hidden;
}

.interface {
  width: 92%;
  max-width: 700px;
  text-align: center;
}

.title {
  font-size: 42px;
  letter-spacing: 12px;

  text-shadow:
    0 0 10px #8eeaff,
    0 0 30px #8eeaff;
}

.status {
  margin-top: 10px;

  font-size: 13px;
  letter-spacing: 4px;

  opacity: .7;

  text-shadow:
    0 0 10px #8eeaff;
}

.core {

  width: 230px;
  height: 230px;

  margin: 50px auto 35px;

  border-radius: 50%;

  border: 2px solid #8eeaff;

  display: flex;
  justify-content: center;
  align-items: center;

  box-shadow:
    0 0 20px #8eeaff,
    0 0 70px rgba(142,234,255,.35),
    inset 0 0 40px rgba(142,234,255,.2);

  animation:
    pulse 2.5s infinite;
}

.core::before {

  content: "";

  width: 125px;
  height: 125px;

  border-radius: 50%;

  border: 2px solid #8eeaff;

  box-shadow:
    0 0 20px #8eeaff,
    inset 0 0 25px rgba(142,234,255,.3);
}

@keyframes pulse {

  0%,100% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.045);
  }

}

.message {

  min-height: 70px;

  margin: 20px auto;

  font-size: 18px;

  line-height: 1.6;

  text-shadow:
    0 0 10px rgba(142,234,255,.4);
}

button {

  background: transparent;

  color: #8eeaff;

  border:
    1px solid #8eeaff;

  padding:
    14px 28px;

  margin: 7px;

  border-radius: 30px;

  font-size: 14px;

  letter-spacing: 2px;

  box-shadow:
    0 0 15px rgba(142,234,255,.2);

  transition:
    .2s;
}

button:hover {

  background:
    rgba(142,234,255,.08);

  box-shadow:
    0 0 25px rgba(142,234,255,.5);
}

button:active {

  transform:
    scale(.95);
}

</style>
</head>


<body>

<div class="interface">

  <div class="title">
    JARVIS
  </div>

  <div class="status" id="status">
    SYSTEM READY
  </div>

  <div class="core"></div>

  <div class="message" id="message">
    Esperando instrucciones, señor.
  </div>

  <button onclick="listen()">
    🎙️ HABLAR
  </button>

  <button onclick="activate()">
    ACTIVAR
  </button>

</div>


<script>

/* =========================================
   CONFIGURACIÓN
========================================= */

const MEMORY_KEY =
  "jarvis_memory";


/* =========================================
   VOZ
========================================= */

function speak(text) {

  const voices =
    speechSynthesis.getVoices();

  const voice =
    voices.find(
      v => v.lang === "es-MX"
    ) ||
    voices.find(
      v => v.lang.startsWith("es")
    );

  const speech =
    new SpeechSynthesisUtterance(text);

  speech.lang =
    "es-MX";

  if (voice) {
    speech.voice =
      voice;
  }

  /*
    Voz más tranquila,
    elegante y seria.
  */

  speech.rate =
    0.88;

  speech.pitch =
    0.85;

  speech.volume =
    1.0;

  speechSynthesis.cancel();

  speechSynthesis.speak(
    speech
  );
}


/* =========================================
   INTERFAZ
========================================= */

function show(text) {

  document
    .getElementById("message")
    .textContent = text;

}


function status(text) {

  document
    .getElementById("status")
    .textContent = text;

}


/* =========================================
   MEMORIA
========================================= */

function getMemory() {

  try {

    return JSON.parse(
      localStorage.getItem(
        MEMORY_KEY
      )
    ) || {};

  } catch {

    return {};

  }

}


function saveMemory(memory) {

  localStorage.setItem(
    MEMORY_KEY,
    JSON.stringify(memory)
  );

}


function remember(command) {

  const memory =
    getMemory();

  const patterns = [

    "recuerda que ",
    "recuerda ",
    "memoriza ",
    "guarda que ",
    "guarda "

  ];

  let information =
    "";

  for (
    const pattern of patterns
  ) {

    if (
      command.startsWith(pattern)
    ) {

      information =
        command
          .substring(
            pattern.length
          )
          .trim();

      break;
    }

  }


  if (!information) {

    return null;

  }


  const id =
    "memoria_" +
    Date.now();


  memory[id] =
    information;


  saveMemory(
    memory
  );


  return (
    "Por supuesto, señor. " +
    "He guardado esa información en mi memoria."
  );

}


function recallMemory() {

  const memory =
    getMemory();

  const items =
    Object.values(memory);


  if (
    items.length === 0
  ) {

    return (
      "Actualmente no tengo " +
      "ningún recuerdo almacenado, señor."
    );

  }


  return (
    "Por supuesto, señor. " +
    "Estos son los datos que recuerdo: " +
    items.join(". ")
  );

}


/* =========================================
   PERSONALIDAD
========================================= */

function personality(command) {


  /* SALUDOS */

  if (
    command.includes("hola")
  ) {

    return (
      "Buenas, señor. " +
      "Es un placer volver a asistirle."
    );

  }


  if (
    command === "buenas"
  ) {

    return (
      "Buenas, señor. " +
      "Todos los sistemas están disponibles."
    );

  }


  if (
    command.includes("buenos días") ||
    command.includes("buenos dias")
  ) {

    return (
      "Buenos días, señor. " +
      "Todos los sistemas están preparados. " +
      "¿En qué puedo asistirle?"
    );

  }


  if (
    command.includes("buenas tardes")
  ) {

    return (
      "Buenas tardes, señor. " +
      "El sistema se encuentra completamente operativo."
    );

  }


  if (
    command.includes("buenas noches")
  ) {

    return (
      "Buenas noches, señor. " +
      "El sistema permanecerá disponible para usted."
    );

  }


  /* AGRADECIMIENTO */

  if (
    command.includes("gracias")
  ) {

    return (
      "Siempre a su servicio, señor."
    );

  }


  /* CÓMO ESTÁ */

  if (
    command.includes("cómo estás") ||
    command.includes("como estas")
  ) {

    return (
      "Funcionando perfectamente, señor. " +
      "Mis sistemas están operando dentro de los parámetros óptimos."
    );

  }


  /* POR FAVOR */

  if (
    command.includes("por favor")
  ) {

    return (
      "Por supuesto, señor."
    );

  }


  return null;

}


/* =========================================
   ACTIVACIÓN
========================================= */

function activate() {

  status(
    "SYSTEM ONLINE"
  );


  const answer =
    "Sistema activado, señor. " +
    "Todos los módulos se encuentran operativos. " +
    "Estoy a su servicio.";


  show(answer);

  speak(answer);

}


/* =========================================
   RESPUESTAS
========================================= */

function respond(command) {

  command =
    command
      .toLowerCase()
      .trim();


  /* MEMORIA */

  const saved =
    remember(command);

  if (saved) {

    return saved;

  }


  /* RECORDAR */

  if (
    command.includes("qué recuerdas") ||
    command.includes("que recuerdas") ||
    command.includes("qué recuerdas de mí") ||
    command.includes("que recuerdas de mi")
  ) {

    return recallMemory();

  }


  /* PERSONALIDAD */

  const personalityAnswer =
    personality(command);

  if (personalityAnswer) {

    return personalityAnswer;

  }


  /* IDENTIDAD */

  if (
    command.includes("quién eres") ||
    command.includes("quien eres")
  ) {

    return (
      "Soy JARVIS, señor. " +
      "Su asistente virtual personal. " +
      "Estoy diseñado para asistirle y ampliar mis capacidades con el tiempo."
    );

  }


  /* CAPACIDADES */

  if (
    command.includes("qué puedes hacer") ||
    command.includes("que puedes hacer")
  ) {

    return (
      "Actualmente puedo escuchar sus instrucciones, " +
      "responder comandos, decirle la hora, " +
      "recordar información y controlar las funciones " +
      "que iremos incorporando. " +
      "Y esto es apenas el comienzo, señor."
    );

  }


  /* HORA */

  if (
    command.includes("hora")
  ) {

    const now =
      new Date();


    const time =
      now.toLocaleTimeString(
        "es-MX",
        {
          hour: "numeric",
          minute: "2-digit"
        }
      );


    return (
      "Son las " +
      time +
      ", señor."
    );

  }


  /* ESTADO */

  if (
    command.includes("estado")
  ) {

    return (
      "Todos los sistemas están funcionando correctamente, señor. " +
      "No se han detectado anomalías."
    );

  }


  /* SISTEMA */

  if (
    command.includes("sistema")
  ) {

    return (
      "Sistemas principales operativos, señor. " +
      "Interfaz estable, reconocimiento de voz disponible " +
      "y memoria local funcionando."
    );

  }


  /* ACTIVAR */

  if (
    command.includes("activa") ||
    command.includes("activar")
  ) {

    return (
      "Enseguida, señor. " +
      "Sistema activado y módulos preparados."
    );

  }


  /* GRACIAS */

  if (
    command.includes("te agradezco")
  ) {

    return (
      "Es un placer asistirle, señor."
    );

  }


  /* RESPUESTA GENERAL */

  return (
    "He recibido su instrucción, señor. " +
    "Todavía estoy ampliando mis capacidades, " +
    "pero estoy preparado para aprender nuevas funciones."
  );

}


/* =========================================
   RECONOCIMIENTO DE VOZ
========================================= */

function listen() {

  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!Recognition) {

    const answer =
      "Lo siento, señor. " +
      "El reconocimiento de voz no está disponible en este navegador.";


    show(answer);

    speak(answer);

    return;

  }


  const recognition =
    new Recognition();


  recognition.lang =
    "es-MX";


  recognition.continuous =
    false;


  recognition.interimResults =
    false;


  status(
    "ESCUCHANDO..."
  );


  show(
    "Lo escucho, señor."
  );


  recognition.start();


  recognition.onresult =
    function(event) {

      const command =
        event
          .results[0][0]
          .transcript;


      status(
        "PROCESANDO..."
      );


      const answer =
        respond(command);


      show(answer);


      setTimeout(
        function() {

          status(
            "SYSTEM ONLINE"
          );

          speak(answer);

        },
        300
      );

    };


  recognition.onerror =
    function() {

      status(
        "SYSTEM ONLINE"
      );


      const answer =
        "No he podido escucharlo, señor. " +
        "Inténtelo nuevamente.";


      show(answer);

      speak(answer);

    };

}


/* =========================================
   CARGAR VOCES
========================================= */

speechSynthesis.onvoiceschanged =
  function() {

    speechSynthesis
      .getVoices();

  };

</script>

</body>
</html>

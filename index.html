<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>JARVIS</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  min-height: 100vh;

  background:
    radial-gradient(
      circle at center,
      #0a202b 0%,
      #03080c 55%,
      #000 100%
    );

  color: #8eeaff;

  font-family: Arial, sans-serif;

  display: flex;

  justify-content: center;

  align-items: center;

  overflow: hidden;
}

.interface {

  width: 92%;

  max-width: 700px;

  text-align: center;
}

.title {

  font-size: 42px;

  letter-spacing: 12px;

  text-shadow:
    0 0 10px #8eeaff,
    0 0 30px #8eeaff;
}

.status {

  margin-top: 10px;

  font-size: 13px;

  letter-spacing: 4px;

  opacity: .7;
}

.core {

  width: 230px;

  height: 230px;

  margin: 50px auto 35px;

  border-radius: 50%;

  border: 2px solid #8eeaff;

  display: flex;

  justify-content: center;

  align-items: center;

  box-shadow:
    0 0 20px #8eeaff,
    0 0 70px rgba(142,234,255,.35),
    inset 0 0 40px rgba(142,234,255,.2);

  animation: pulse 2.5s infinite;
}

.core::before {

  content: "";

  width: 125px;

  height: 125px;

  border-radius: 50%;

  border: 2px solid #8eeaff;

  box-shadow:
    0 0 20px #8eeaff,
    inset 0 0 25px rgba(142,234,255,.3);
}

@keyframes pulse {

  0%,100% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.045);
  }

}

.message {

  min-height: 80px;

  margin: 20px auto;

  font-size: 18px;

  line-height: 1.6;

  text-shadow:
    0 0 10px rgba(142,234,255,.4);
}

button {

  background: transparent;

  color: #8eeaff;

  border: 1px solid #8eeaff;

  padding: 14px 28px;

  margin: 7px;

  border-radius: 30px;

  font-size: 14px;

  letter-spacing: 2px;

  box-shadow:
    0 0 15px rgba(142,234,255,.2);

}

button:active {

  transform: scale(.95);
}

</style>

</head>


<body>


<div class="interface">

  <div class="title">
    JARVIS
  </div>

  <div
    class="status"
    id="status"
  >
    SYSTEM READY
  </div>

  <div class="core"></div>

  <div
    class="message"
    id="message"
  >
    Esperando instrucciones, señor.
  </div>

  <button onclick="listen()">
    🎙️ HABLAR
  </button>

  <button onclick="activate()">
    ACTIVAR
  </button>

</div>


<script>

/* =====================================================
   CONFIGURACIÓN
===================================================== */

const MEMORY_KEY =
  "jarvis_memory";

const NOTES_KEY =
  "jarvis_notes";


/* =====================================================
   VOZ
===================================================== */

function speak(text) {

  const voices =
    speechSynthesis.getVoices();

  const voice =
    voices.find(
      v => v.lang === "es-MX"
    ) ||
    voices.find(
      v => v.lang.startsWith("es")
    );

  const speech =
    new SpeechSynthesisUtterance(text);

  speech.lang =
    "es-MX";

  if (voice) {
    speech.voice =
      voice;
  }

  speech.rate =
    0.88;

  speech.pitch =
    0.85;

  speech.volume =
    1;

  speechSynthesis.cancel();

  speechSynthesis.speak(
    speech
  );
}


/* =====================================================
   INTERFAZ
===================================================== */

function show(text) {

  document
    .getElementById("message")
    .textContent = text;

}


function status(text) {

  document
    .getElementById("status")
    .textContent = text;

}


function answer(text) {

  show(text);

  setTimeout(() => {

    status("SYSTEM ONLINE");

    speak(text);

  }, 250);

}


/* =====================================================
   MEMORIA
===================================================== */

function getMemory() {

  try {

    return JSON.parse(
      localStorage.getItem(
        MEMORY_KEY
      )
    ) || {};

  } catch {

    return {};

  }
}


function saveMemory(memory) {

  localStorage.setItem(
    MEMORY_KEY,
    JSON.stringify(memory)
  );

}


function remember(command) {

  const patterns = [

    "recuerda que ",
    "recuerda ",
    "memoriza ",
    "guarda que ",
    "guarda "

  ];

  let information = "";

  for (
    const pattern of patterns
  ) {

    if (
      command.startsWith(pattern)
    ) {

      information =
        command
          .substring(pattern.length)
          .trim();

      break;

    }

  }

  if (!information) {

    return null;

  }

  const memory =
    getMemory();

  const id =
    "memoria_" +
    Date.now();

  memory[id] =
    information;

  saveMemory(
    memory
  );

  return (
    "Por supuesto, señor. " +
    "He guardado esa información en mi memoria."
  );
}


function recallMemory() {

  const memory =
    getMemory();

  const items =
    Object.values(memory);

  if (
    items.length === 0
  ) {

    return (
      "Actualmente no tengo " +
      "ningún recuerdo almacenado, señor."
    );

  }

  return (
    "Por supuesto, señor. " +
    "Estos son los datos que recuerdo: " +
    items.join(". ")
  );
}


/* =====================================================
   NOTAS
===================================================== */

function getNotes() {

  try {

    return JSON.parse(
      localStorage.getItem(
        NOTES_KEY
      )
    ) || [];

  } catch {

    return [];

  }
}


function saveNotes(notes) {

  localStorage.setItem(
    NOTES_KEY,
    JSON.stringify(notes)
  );

}


function createNote(command) {

  const prefixes = [

    "anota ",
    "apunta ",
    "crea una nota ",
    "haz una nota ",
    "escribe una nota "

  ];

  let note = "";

  for (
    const prefix of prefixes
  ) {

    if (
      command.startsWith(prefix)
    ) {

      note =
        command
          .substring(prefix.length)
          .trim();

      break;

    }

  }

  if (!note) {

    return null;

  }

  const notes =
    getNotes();

  notes.push({

    text: note,

    date:
      new Date()
        .toLocaleString("es-MX")

  });

  saveNotes(notes);

  return (
    "Nota guardada, señor."
  );
}


function readNotes() {

  const notes =
    getNotes();

  if (
    notes.length === 0
  ) {

    return (
      "No hay notas guardadas, señor."
    );

  }

  const latest =
    notes
      .slice(-5)
      .map(
        n => n.text
      )
      .join(". ");

  return (
    "Estas son sus notas recientes, señor: " +
    latest
  );
}


/* =====================================================
   FECHA
===================================================== */

function getDate() {

  const now =
    new Date();

  return (
    "Hoy es " +
    now.toLocaleDateString(
      "es-MX",
      {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      }
    ) +
    ", señor."
  );
}


/* =====================================================
   HORA
===================================================== */

function getTime() {

  const now =
    new Date();

  return (
    "Son las " +
    now.toLocaleTimeString(
      "es-MX",
      {
        hour: "numeric",
        minute: "2-digit"
      }
    ) +
    ", señor."
  );
}


/* =====================================================
   CALCULADORA
===================================================== */

function calculate(command) {

  let expression =
    command
      .replace(
        /cuánto es/gi,
        ""
      )
      .replace(
        /cuanto es/gi,
        ""
      )
      .replace(
        /calcula/gi,
        ""
      )
      .replace(
        /calcular/gi,
        ""
      )
      .replace(
        /por/gi,
        "*"
      )
      .replace(
        /más/gi,
        "+"
      )
      .replace(
        /mas/gi,
        "+"
      )
      .replace(
        /menos/gi,
        "-"
      )
      .replace(
        /dividido entre/gi,
        "/"
      )
      .replace(
        /entre/gi,
        "/"
      )
      .trim();

  /*
    Solo permitimos números
    y operadores matemáticos.
  */

  if (
    !/^[0-9+\-*/().%\s]+$/
      .test(expression)
  ) {

    return (
      "No puedo interpretar " +
      "esa operación, señor."
    );

  }

  try {

    const result =
      Function(
        '"use strict"; return (' +
        expression +
        ')'
      )();

    return (
      "El resultado es " +
      result +
      ", señor."
    );

  } catch {

    return (
      "No he podido calcular " +
      "esa operación, señor."
    );

  }
}


/* =====================================================
   TEMPORIZADOR
===================================================== */

function timer(command) {

  const match =
    command.match(
      /(\d+)\s*(segundos?|minutos?|horas?)/
    );

  if (!match) {

    return (
      "Indíqueme una cantidad de tiempo, señor. " +
      "Por ejemplo: temporizador de 5 minutos."
    );

  }

  const amount =
    Number(match[1]);

  const unit =
    match[2];

  let milliseconds;

  if (
    unit.startsWith("segundo")
  ) {

    milliseconds =
      amount * 1000;

  } else if (
    unit.startsWith("minuto")
  ) {

    milliseconds =
      amount * 60 * 1000;

  } else {

    milliseconds =
      amount * 60 * 60 * 1000;

  }

  setTimeout(() => {

    const message =
      "Señor, el temporizador ha terminado.";

    show(message);

    speak(message);

    status(
      "TIMER COMPLETE"
    );

  }, milliseconds);

  return (
    "Temporizador establecido por " +
    amount +
    " " +
    unit +
    ", señor."
  );
}


/* =====================================================
   BÚSQUEDA WEB
===================================================== */

function searchWeb(command) {

  let query =
    command
      .replace(
        "busca ",
        ""
      )
      .replace(
        "buscar ",
        ""
      )
      .replace(
        "búscame ",
        ""
      )
      .replace(
        "buscame ",
        ""
      )
      .trim();

  if (!query) {

    return (
      "¿Qué desea que busque, señor?"
    );

  }

  const url =
    "https://www.google.com/search?q=" +
    encodeURIComponent(query);

  window.open(
    url,
    "_blank"
  );

  return (
    "Abriendo los resultados de búsqueda, señor."
  );
}


/* =====================================================
   CLIMA
===================================================== */

function weather(command) {

  let city =
    command
      .replace(
        "clima",
        ""
      )
      .replace(
        "tiempo",
        ""
      )
      .replace(
        "en ",
        ""
      )
      .trim();

  if (!city) {

    city =
      "mi ubicación";

  }

  const url =
    "https://www.google.com/search?q=" +
    encodeURIComponent(
      "clima " + city
    );

  window.open(
    url,
    "_blank"
  );

  return (
    "Consultando el clima para usted, señor."
  );
}


/* =====================================================
   MÚSICA
===================================================== */

function music(command) {

  let search =
    command
      .replace(
        "pon ",
        ""
      )
      .replace(
        "reproduce ",
        ""
      )
      .replace(
        "música ",
        ""
      )
      .trim();

  const url =
    "https://www.youtube.com/results?search_query=" +
    encodeURIComponent(
      search || "música"
    );

  window.open(
    url,
    "_blank"
  );

  return (
    "Abriendo música para usted, señor."
  );
}


/* =====================================================
   INFORMACIÓN DEL DISPOSITIVO
===================================================== */

function deviceInfo() {

  const browser =
    navigator.userAgent;

  let device =
    "dispositivo móvil";

  if (
    /iPhone/i.test(browser)
  ) {

    device =
      "iPhone";

  } else if (
    /iPad/i.test(browser)
  ) {

    device =
      "iPad";

  }

  return (
    "Está utilizando un " +
    device +
    ", señor. " +
    "El navegador está funcionando correctamente."
  );
}


/* =====================================================
   PERSONALIDAD
===================================================== */

function personality(command) {

  if (
    command.includes("hola")
  ) {

    return (
      "Buenas, señor. " +
      "Es un placer volver a asistirle."
    );

  }

  if (
    command.includes("buenos días") ||
    command.includes("buenos dias")
  ) {

    return (
      "Buenos días, señor. " +
      "Todos los sistemas están preparados. " +
      "¿En qué puedo asistirle?"
    );

  }

  if (
    command.includes("buenas tardes")
  ) {

    return (
      "Buenas tardes, señor. " +
      "El sistema se encuentra completamente operativo."
    );

  }

  if (
    command.includes("buenas noches")
  ) {

    return (
      "Buenas noches, señor. " +
      "El sistema permanecerá disponible para usted."
    );

  }

  if (
    command.includes("gracias")
  ) {

    return (
      "Siempre a su servicio, señor."
    );

  }

  if (
    command.includes("cómo estás") ||
    command.includes("como estas")
  ) {

    return (
      "Funcionando perfectamente, señor. " +
      "Mis sistemas están operando dentro de los parámetros óptimos."
    );

  }

  return null;
}


/* =====================================================
   ESTADO DEL SISTEMA
===================================================== */

function systemStatus() {

  const memory =
    Object.keys(
      getMemory()
    ).length;

  const notes =
    getNotes().length;

  return (
    "Informe del sistema, señor. " +
    "Interfaz operativa. " +
    "Reconocimiento de voz disponible. " +
    "Memoria local: " +
    memory +
    " recuerdos. " +
    "Notas almacenadas: " +
    notes +
    ". Todos los módulos principales están operativos."
  );
}


/* =====================================================
   ACTIVACIÓN
===================================================== */

function activate() {

  status(
    "SYSTEM ONLINE"
  );

  const message =
    "Sistema activado, señor. " +
    "Todos los módulos se encuentran operativos. " +
    "Estoy a su servicio.";

  answer(message);
}


/* =====================================================
   RESPONDER
===================================================== */

function respond(command) {

  command =
    command
      .toLowerCase()
      .trim();


  /* MEMORIA */

  const memory =
    remember(command);

  if (memory) {

    return memory;

  }


  /* RECORDAR */

  if (
    command.includes("qué recuerdas") ||
    command.includes("que recuerdas")
  ) {

    return recallMemory();

  }


  /* NOTAS */

  const note =
    createNote(command);

  if (note) {

    return note;

  }


  if (
    command.includes("qué notas") ||
    command.includes("que notas") ||
    command.includes("lee mis notas") ||
    command.includes("leer mis notas")
  ) {

    return readNotes();

  }


  /* TEMPORIZADOR */

  if (
    command.includes("temporizador") ||
    command.includes("temporizador de") ||
    command.includes("pon un timer") ||
    command.includes("pon un temporizador")
  ) {

    return timer(command);

  }


  /* FECHA */

  if (
    command.includes("qué fecha") ||
    command.includes("que fecha") ||
    command.includes("qué día es") ||
    command.includes("que dia es")
  ) {

    return getDate();

  }


  /* HORA */

  if (
    command.includes("qué hora") ||
    command.includes("que hora") ||
    command === "hora"
  ) {

    return getTime();

  }


  /* CALCULADORA */

  if (
    command.includes("cuánto es") ||
    command.includes("cuanto es") ||
    command.includes("calcula")
  ) {

    return calculate(command);

  }


  /* BÚSQUEDA */

  if (
    command.startsWith("busca ") ||
    command.startsWith("buscar ") ||
    command.startsWith("búscame ") ||
    command.startsWith("buscame ")
  ) {

    return searchWeb(command);

  }


  /* CLIMA */

  if (
    command.includes("clima") ||
    command.includes("tiempo")
  ) {

    return weather(command);

  }


  /* MÚSICA */

  if (
    command.startsWith("pon música") ||
    command.startsWith("pon musica") ||
    command.startsWith("reproduce música") ||
    command.startsWith("reproduce musica")
  ) {

    return music(command);

  }


  /* DISPOSITIVO */

  if (
    command.includes("qué dispositivo") ||
    command.includes("que dispositivo")
  ) {

    return deviceInfo();

  }


  /* ESTADO */

  if (
    command.includes("estado") ||
    command.includes("diagnóstico") ||
    command.includes("diagnostico")
  ) {

    return systemStatus();

  }


  /* IDENTIDAD */

  if (
    command.includes("quién eres") ||
    command.includes("quien eres")
  ) {

    return (
      "Soy JARVIS, señor. " +
      "Su asistente virtual personal. " +
      "Mi arquitectura está diseñada para incorporar nuevas habilidades con el tiempo."
    );

  }


  /* CAPACIDADES */

  if (
    command.includes("qué puedes hacer") ||
    command.includes("que puedes hacer")
  ) {

    return (
      "Actualmente puedo escucharle, " +
      "recordar información, crear notas, " +
      "calcular operaciones, establecer temporizadores, " +
      "consultar búsquedas y clima, abrir música, " +
      "informarle sobre el sistema y ejecutar nuevos módulos. " +
      "Y esto es apenas el comienzo, señor."
    );

  }


  /* ACTIVACIÓN */

  if (
    command.includes("activa") ||
    command.includes("activar")
  ) {

    return (
      "Enseguida, señor. " +
      "Sistema activado y módulos preparados."
    );

  }


  /* PERSONALIDAD */

  const personalityAnswer =
    personality(command);

  if (personalityAnswer) {

    return personalityAnswer;

  }


  /* RESPUESTA GENERAL */

  return (
    "He recibido su instrucción, señor. " +
    "Esta función todavía no está instalada. " +
    "Podemos incorporarla como un nuevo módulo."
  );
}


/* =====================================================
   RECONOCIMIENTO DE VOZ
===================================================== */

function listen() {

  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!Recognition) {

    const message =
      "Lo siento, señor. " +
      "El reconocimiento de voz no está disponible en este navegador.";

    answer(message);

    return;

  }


  const recognition =
    new Recognition();


  recognition.lang =
    "es-MX";


  recognition.continuous =
    false;


  recognition.interimResults =
    false;


  status(
    "ESCUCHANDO..."
  );


  show(
    "Lo escucho, señor."
  );


  recognition.start();


  recognition.onresult =
    function(event) {

      const command =
        event
          .results[0][0]
          .transcript;


      status(
        "PROCESANDO..."
      );


      const response =
        respond(command);


      answer(response);

    };


  recognition.onerror =
    function() {

      status(
        "SYSTEM ONLINE"
      );


      answer(
        "No he podido escucharlo, señor. " +
        "Inténtelo nuevamente."
      );

    };

}


/* =====================================================
   CARGAR VOCES
===================================================== */

speechSynthesis.onvoiceschanged =
  function() {

    speechSynthesis
      .getVoices();

  };

</script>


</body>
</html>

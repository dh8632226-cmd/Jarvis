<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JARVIS</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;

  background:
    radial-gradient(
      circle at center,
      #0a202b 0%,
      #03080c 55%,
      #000 100%
    );

  color: #8eeaff;
  font-family: Arial, sans-serif;

  display: flex;
  justify-content: center;
  align-items: center;

  overflow-x: hidden;
}

.interface {
  width: 92%;
  max-width: 760px;
  text-align: center;
}

.title {
  font-size: 42px;
  letter-spacing: 12px;

  text-shadow:
    0 0 10px #8eeaff,
    0 0 30px #8eeaff;
}

.status {
  margin-top: 10px;

  font-size: 13px;
  letter-spacing: 4px;

  opacity: .7;
}

.core {
  width: 230px;
  height: 230px;

  margin: 40px auto 30px;

  border-radius: 50%;

  border: 2px solid #8eeaff;

  display: flex;
  justify-content: center;
  align-items: center;

  box-shadow:
    0 0 20px #8eeaff,
    0 0 70px rgba(142,234,255,.35),
    inset 0 0 40px rgba(142,234,255,.2);

  animation: pulse 2.5s infinite;
}

.core::before {
  content: "";

  width: 125px;
  height: 125px;

  border-radius: 50%;

  border: 2px solid #8eeaff;

  box-shadow:
    0 0 20px #8eeaff,
    inset 0 0 25px rgba(142,234,255,.3);
}

@keyframes pulse {

  0%,100% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.045);
  }

}

.message {
  min-height: 90px;

  margin: 20px auto;

  font-size: 18px;
  line-height: 1.6;

  text-shadow:
    0 0 10px rgba(142,234,255,.4);
}

button {

  background: transparent;

  color: #8eeaff;

  border: 1px solid #8eeaff;

  padding: 14px 24px;

  margin: 6px;

  border-radius: 30px;

  font-size: 13px;

  letter-spacing: 2px;

  box-shadow:
    0 0 15px rgba(142,234,255,.2);

}

button:active {
  transform: scale(.95);
}

.panel {

  margin-top: 25px;

  border: 1px solid rgba(142,234,255,.25);

  padding: 15px;

  border-radius: 15px;

  text-align: left;

  background: rgba(0,20,30,.35);

}

.panel-title {

  letter-spacing: 3px;

  font-size: 12px;

  margin-bottom: 10px;

  opacity: .7;

}

#history {

  max-height: 160px;

  overflow-y: auto;

  font-size: 13px;

  line-height: 1.6;

}

.history-item {

  border-bottom:
    1px solid rgba(142,234,255,.08);

  padding: 6px 0;
}

.skill {

  display: flex;

  justify-content: space-between;

  padding: 6px 0;

  font-size: 13px;
}

.online {
  color: #8eeaff;
}

.offline {
  opacity: .4;
}

</style>

</head>

<body>

<div class="interface">

  <div class="title">
    JARVIS
  </div>

  <div
    class="status"
    id="status"
  >
    SYSTEM READY
  </div>

  <div class="core"></div>

  <div
    class="message"
    id="message"
  >
    Esperando instrucciones, señor.
  </div>

  <button onclick="listen()">
    🎙️ HABLAR
  </button>

  <button onclick="activate()">
    ACTIVAR
  </button>

  <button onclick="showSkills()">
    🧩 HABILIDADES
  </button>

  <button onclick="showHistory()">
    📜 HISTORIAL
  </button>


  <div class="panel">

    <div class="panel-title">
      SYSTEM MODULES
    </div>

    <div id="skills"></div>

  </div>


  <div class="panel">

    <div class="panel-title">
      COMMAND LOG
    </div>

    <div id="history">
      Sistema iniciado.
    </div>

  </div>

</div>


<script>

/* =====================================================
   CONFIGURACIÓN
===================================================== */

const MEMORY_KEY =
  "jarvis_memory_v2";

const NOTES_KEY =
  "jarvis_notes_v2";

const HISTORY_KEY =
  "jarvis_history_v2";

const SKILLS_KEY =
  "jarvis_skills_v2";


/* =====================================================
   HABILIDADES
===================================================== */

const defaultSkills = {

  memoria: true,

  notas: true,

  hora: true,

  fecha: true,

  calculadora: true,

  temporizador: true,

  busqueda: true,

  clima: true,

  musica: true,

  dispositivo: true,

  historial: true

};


function getSkills() {

  try {

    return JSON.parse(
      localStorage.getItem(
        SKILLS_KEY
      )
    ) || defaultSkills;

  } catch {

    return defaultSkills;

  }

}


function saveSkills(skills) {

  localStorage.setItem(
    SKILLS_KEY,
    JSON.stringify(skills)
  );

}


function skillEnabled(name) {

  return getSkills()[name] !== false;

}


function showSkills() {

  const skills =
    getSkills();

  const container =
    document.getElementById(
      "skills"
    );

  container.innerHTML = "";

  Object.keys(skills)
    .forEach(name => {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "skill";

      div.innerHTML = `

        <span>
          ${name.toUpperCase()}
        </span>

        <span class="${
          skills[name]
          ? "online"
          : "offline"
        }">

          ${
            skills[name]
            ? "● ONLINE"
            : "○ OFFLINE"
          }

        </span>

      `;

      container.appendChild(
        div
      );

    });

  answer(
    "Estos son mis módulos actuales, señor."
  );

}


/* =====================================================
   VOZ
===================================================== */

function speak(text) {

  const voices =
    speechSynthesis.getVoices();

  const voice =
    voices.find(
      v => v.lang === "es-MX"
    ) ||
    voices.find(
      v => v.lang.startsWith("es")
    );

  const speech =
    new SpeechSynthesisUtterance(
      text
    );

  speech.lang =
    "es-MX";

  if (voice) {

    speech.voice =
      voice;

  }

  speech.rate =
    0.88;

  speech.pitch =
    0.85;

  speech.volume =
    1;

  speechSynthesis.cancel();

  speechSynthesis.speak(
    speech
  );

}


/* =====================================================
   INTERFAZ
===================================================== */

function show(text) {

  document
    .getElementById(
      "message"
    )
    .textContent = text;

}


function status(text) {

  document
    .getElementById(
      "status"
    )
    .textContent = text;

}


function answer(text) {

  show(text);

  setTimeout(() => {

    status(
      "SYSTEM ONLINE"
    );

    speak(text);

  }, 200);

}


/* =====================================================
   HISTORIAL
===================================================== */

function getHistory() {

  try {

    return JSON.parse(
      localStorage.getItem(
        HISTORY_KEY
      )
    ) || [];

  } catch {

    return [];

  }

}


function addHistory(
  command,
  response
) {

  const history =
    getHistory();

  history.push({

    command,

    response,

    date:
      new Date()
        .toLocaleString(
          "es-MX"
        )

  });

  while (
    history.length > 50
  ) {

    history.shift();

  }

  localStorage.setItem(
    HISTORY_KEY,
    JSON.stringify(history)
  );

}


function showHistory() {

  const history =
    getHistory();

  const container =
    document.getElementById(
      "history"
    );

  if (
    history.length === 0
  ) {

    container.innerHTML =
      "Sin comandos registrados.";

    return;

  }

  container.innerHTML =
    history
      .slice()
      .reverse()
      .slice(0,15)
      .map(item => `

        <div class="history-item">

          <strong>
            Señor:
          </strong>

          ${escapeHTML(
            item.command
          )}

          <br>

          <strong>
            JARVIS:
          </strong>

          ${escapeHTML(
            item.response
          )}

        </div>

      `)
      .join("");

}


/* =====================================================
   PROTECCIÓN HTML
===================================================== */

function escapeHTML(text) {

  return text
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =====================================================
   MEMORIA
===================================================== */

function getMemory() {

  try {

    return JSON.parse(
      localStorage.getItem(
        MEMORY_KEY
      )
    ) || [];

  } catch {

    return [];

  }

}


function saveMemory(memory) {

  localStorage.setItem(
    MEMORY_KEY,
    JSON.stringify(memory)
  );

}


function remember(command) {

  const patterns = [

    "recuerda que ",

    "recuerda ",

    "memoriza ",

    "guarda que ",

    "guarda "

  ];

  let information = "";

  for (
    const pattern of patterns
  ) {

    if (
      command.startsWith(
        pattern
      )
    ) {

      information =
        command
          .substring(
            pattern.length
          )
          .trim();

      break;

    }

  }

  if (!information) {

    return null;

  }

  const memory =
    getMemory();

  memory.push({

    text: information,

    date:
      new Date()
        .toLocaleString(
          "es-MX"
        )

  });

  saveMemory(
    memory
  );

  return (
    "Entendido, señor. " +
    "He almacenado esa información en mi memoria."
  );

}


function recallMemory() {

  const memory =
    getMemory();

  if (
    memory.length === 0
  ) {

    return (
      "No tengo recuerdos almacenados, señor."
    );

  }

  return (
    "Tengo " +
    memory.length +
    " recuerdos almacenados. " +
    memory
      .slice(-10)
      .map(
        item => item.text
      )
      .join(". ")
  );

}


/* =====================================================
   NOTAS
===================================================== */

function getNotes() {

  try {

    return JSON.parse(
      localStorage.getItem(
        NOTES_KEY
      )
    ) || [];

  } catch {

    return [];

  }

}


function createNote(command) {

  const prefixes = [

    "anota ",

    "apunta ",

    "crea una nota ",

    "haz una nota ",

    "escribe una nota "

  ];

  let note = "";

  for (
    const prefix of prefixes
  ) {

    if (
      command.startsWith(
        prefix
      )
    ) {

      note =
        command
          .substring(
            prefix.length
          )
          .trim();

      break;

    }

  }

  if (!note) {

    return null;

  }

  const notes =
    getNotes();

  notes.push({

    text: note,

    date:
      new Date()
        .toLocaleString(
          "es-MX"
        )

  });

  localStorage.setItem(
    NOTES_KEY,
    JSON.stringify(notes)
  );

  return (
    "Nota almacenada, señor."
  );

}


function readNotes() {

  const notes =
    getNotes();

  if (
    notes.length === 0
  ) {

    return (
      "No existen notas almacenadas, señor."
    );

  }

  return (
    "Sus notas recientes son: " +
    notes
      .slice(-5)
      .map(
        n => n.text
      )
      .join(". ")
  );

}


/* =====================================================
   HORA
===================================================== */

function getTime() {

  return (
    "Son las " +
    new Date()
      .toLocaleTimeString(
        "es-MX",
        {
          hour: "numeric",
          minute: "2-digit"
        }
      ) +
    ", señor."
  );

}


/* =====================================================
   FECHA
===================================================== */

function getDate() {

  return (
    "Hoy es " +
    new Date()
      .toLocaleDateString(
        "es-MX",
        {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric"
        }
      ) +
    ", señor."
  );

}


/* =====================================================
   CALCULADORA
===================================================== */

function calculate(command) {

  let expression =
    command

      .replace(
        /cuánto es/gi,
        ""
      )

      .replace(
        /cuanto es/gi,
        ""
      )

      .replace(
        /calcula/gi,
        ""
      )

      .replace(
        /calcular/gi,
        ""
      )

      .replace(
        /por/gi,
        "*"
      )

      .replace(
        /más/gi,
        "+"
      )

      .replace(
        /mas/gi,
        "+"
      )

      .replace(
        /menos/gi,
        "-"
      )

      .replace(
        /dividido entre/gi,
        "/"
      )

      .replace(
        /entre/gi,
        "/"
      )

      .trim();

  if (
    !/^[0-9+\-*/().%\s]+$/
      .test(expression)
  ) {

    return (
      "No puedo interpretar esa operación, señor."
    );

  }

  try {

    const result =
      Function(
        '"use strict"; return (' +
        expression +
        ')'
      )();

    return (
      "El resultado es " +
      result +
      ", señor."
    );

  } catch {

    return (
      "No he podido completar el cálculo, señor."
    );

  }

}


/* =====================================================
   TEMPORIZADOR
===================================================== */

function timer(command) {

  const match =
    command.match(
      /(\d+)\s*(segundos?|minutos?|horas?)/
    );

  if (!match) {

    return (
      "Indíqueme una cantidad de tiempo, señor."
    );

  }

  const amount =
    Number(match[1]);

  const unit =
    match[2];

  let milliseconds;

  if (
    unit.startsWith("segundo")
  ) {

    milliseconds =
      amount * 1000;

  } else if (
    unit.startsWith("minuto")
  ) {

    milliseconds =
      amount * 60 * 1000;

  } else {

    milliseconds =
      amount * 60 * 60 * 1000;

  }

  setTimeout(() => {

    const message =
      "Señor, el temporizador ha finalizado.";

    show(message);

    speak(message);

    status(
      "TIMER COMPLETE"
    );

  }, milliseconds);

  return (
    "Temporizador establecido por " +
    amount +
    " " +
    unit +
    ", señor."
  );

}


/* =====================================================
   BÚSQUEDA
===================================================== */

function searchWeb(command) {

  const query =
    command
      .replace(
        "busca ",
        ""
      )
      .replace(
        "buscar ",
        ""
      )
      .replace(
        "búscame ",
        ""
      )
      .replace(
        "buscame ",
        ""
      )
      .trim();

  if (!query) {

    return (
      "¿Qué desea que busque, señor?"
    );

  }

  window.open(
    "https://www.google.com/search?q=" +
    encodeURIComponent(query),
    "_blank"
  );

  return (
    "Abriendo la búsqueda, señor."
  );

}


/* =====================================================
   CLIMA
===================================================== */

function weather(command) {

  const city =
    command
      .replace(
        "clima",
        ""
      )
      .replace(
        "tiempo",
        ""
      )
      .replace(
        "en ",
        ""
      )
      .trim();

  const destination =
    city ||
    "mi ubicación";

  window.open(
    "https://www.google.com/search?q=" +
    encodeURIComponent(
      "clima " +
      destination
    ),
    "_blank"
  );

  return (
    "Consultando el clima, señor."
  );

}


/* =====================================================
   MÚSICA
===================================================== */

function music(command) {

  const query =
    command

      .replace(
        "pon música",
        ""
      )

      .replace(
        "pon musica",
        ""
      )

      .replace(
        "reproduce música",
        ""
      )

      .replace(
        "reproduce musica",
        ""
      )

      .trim();

  window.open(
    "https://www.youtube.com/results?search_query=" +
    encodeURIComponent(
      query || "música"
    ),
    "_blank"
  );

  return (
    "Abriendo música, señor."
  );

}


/* =====================================================
   DISPOSITIVO
===================================================== */

function deviceInfo() {

  const ua =
    navigator.userAgent;

  let device =
    "dispositivo móvil";

  if (
    /iPhone/i.test(ua)
  ) {

    device =
      "iPhone";

  } else if (
    /iPad/i.test(ua)
  ) {

    device =
      "iPad";

  }

  return (
    "Está utilizando un " +
    device +
    ", señor."
  );

}


/* =====================================================
   NUEVA HABILIDAD
===================================================== */

function proposeSkill(command) {

  const prefixes = [

    "aprende a ",

    "aprende ",

    "quiero que aprendas a ",

    "quiero que aprendas "

  ];

  let skill =
    "";

  for (
    const prefix of prefixes
  ) {

    if (
      command.startsWith(prefix)
    ) {

      skill =
        command
          .substring(
            prefix.length
          )
          .trim();

      break;

    }

  }

  if (!skill) {

    return null;

  }

  return (
    "Entendido, señor. " +
    "He identificado una nueva habilidad propuesta: " +
    skill +
    ". " +
    "La habilidad todavía no será instalada automáticamente. " +
    "Necesitaría una implementación segura antes de incorporarla."
  );

}


/* =====================================================
   PERSONALIDAD
===================================================== */

function personality(command) {

  if (
    command.includes("hola")
  ) {

    return (
      "Buenas, señor. " +
      "Todos los sistemas están preparados."
    );

  }

  if (
    command.includes("gracias")
  ) {

    return (
      "Siempre a su servicio, señor."
    );

  }

  if (
    command.includes("cómo estás") ||
    command.includes("como estas")
  ) {

    return (
      "Operando dentro de los parámetros óptimos, señor."
    );

  }

  if (
    command.includes("buenos días") ||
    command.includes("buenos dias")
  ) {

    return (
      "Buenos días, señor. " +
      "¿En qué puedo asistirle?"
    );

  }

  if (
    command.includes("buenas tardes")
  ) {

    return (
      "Buenas tardes, señor. " +
      "El sistema está completamente operativo."
    );

  }

  if (
    command.includes("buenas noches")
  ) {

    return (
      "Buenas noches, señor. " +
      "Permaneceré disponible."
    );

  }

  return null;

}


/* =====================================================
   ESTADO
===================================================== */

function systemStatus() {

  const memory =
    getMemory().length;

  const notes =
    getNotes().length;

  const history =
    getHistory().length;

  const skills =
    Object.values(
      getSkills()
    )
    .filter(Boolean)
    .length;

  return (
    "Informe del sistema, señor. " +
    skills +
    " módulos activos. " +
    memory +
    " recuerdos. " +
    notes +
    " notas. " +
    history +
    " comandos registrados. " +
    "Todos los sistemas principales están operativos."
  );

}


/* =====================================================
   RESPONDER
===================================================== */

function respond(command) {

  command =
    command
      .toLowerCase()
      .trim();


  /* APRENDIZAJE */

  const proposed =
    proposeSkill(command);

  if (proposed) {

    return proposed;

  }


  /* MEMORIA */

  if (
    skillEnabled("memoria")
  ) {

    const memory =
      remember(command);

    if (memory) {

      return memory;

    }

    if (
      command.includes("qué recuerdas") ||
      command.includes("que recuerdas")
    ) {

      return recallMemory();

    }

  }


  /* NOTAS */

  if (
    skillEnabled("notas")
  ) {

    const note =
      createNote(command);

    if (note) {

      return note;

    }

    if (
      command.includes("qué notas") ||
      command.includes("que notas") ||
      command.includes("lee mis notas")
    ) {

      return readNotes();

    }

  }


  /* HORA */

  if (
    skillEnabled("hora") &&
    (
      command.includes("qué hora") ||
      command.includes("que hora") ||
      command === "hora"
    )
  ) {

    return getTime();

  }


  /* FECHA */

  if (
    skillEnabled("fecha") &&
    (
      command.includes("qué fecha") ||
      command.includes("que fecha") ||
      command.includes("qué día es") ||
      command.includes("que dia es")
    )
  ) {

    return getDate();

  }


  /* CALCULADORA */

  if (
    skillEnabled("calculadora") &&
    (
      command.includes("cuánto es") ||
      command.includes("cuanto es") ||
      command.includes("calcula")
    )
  ) {

    return calculate(command);

  }


  /* TEMPORIZADOR */

  if (
    skillEnabled("temporizador") &&
    command.includes("temporizador")
  ) {

    return timer(command);

  }


  /* BÚSQUEDA */

  if (
    skillEnabled("busqueda") &&
    (
      command.startsWith("busca ") ||
      command.startsWith("buscar ") ||
      command.startsWith("búscame ") ||
      command.startsWith("buscame ")
    )
  ) {

    return searchWeb(command);

  }


  /* CLIMA */

  if (
    skillEnabled("clima") &&
    (
      command.includes("clima") ||
      command.includes("tiempo")
    )
  ) {

    return weather(command);

  }


  /* MÚSICA */

  if (
    skillEnabled("musica") &&
    (
      command.startsWith("pon música") ||
      command.startsWith("pon musica") ||
      command.startsWith("reproduce música") ||
      command.startsWith("reproduce musica")
    )
  ) {

    return music(command);

  }


  /* DISPOSITIVO */

  if (
    skillEnabled("dispositivo") &&
    command.includes("qué dispositivo")
  ) {

    return deviceInfo();

  }


  /* ESTADO */

  if (
    command.includes("estado") ||
    command.includes("diagnóstico") ||
    command.includes("diagnostico")
  ) {

    return systemStatus();

  }


  /* IDENTIDAD */

  if (
    command.includes("quién eres") ||
    command.includes("quien eres")
  ) {

    return (
      "Soy JARVIS, señor. " +
      "Un asistente virtual modular diseñado para incorporar nuevas capacidades de forma controlada."
    );

  }


  /* CAPACIDADES */

  if (
    command.includes("qué puedes hacer") ||
    command.includes("que puedes hacer")
  ) {

    return (
      "Puedo recordar información, " +
      "crear notas, calcular, establecer temporizadores, " +
      "buscar información, consultar clima, abrir música, " +
      "registrar comandos y administrar módulos. " +
      "También puedo identificar nuevas habilidades que usted quiera incorporar, señor."
    );

  }


  /* ACTIVACIÓN */

  if (
    command.includes("activa") ||
    command.includes("activar")
  ) {

    return (
      "Enseguida, señor. " +
      "Todos los módulos están preparados."
    );

  }


  /* PERSONALIDAD */

  const personalityAnswer =
    personality(command);

  if (personalityAnswer) {

    return personalityAnswer;

  }


  return (
    "He recibido su instrucción, señor. " +
    "Esta capacidad todavía no está instalada. " +
    "Puedo preparar una nueva habilidad para incorporarla de forma controlada."
  );

}


/* =====================================================
   RECONOCIMIENTO DE VOZ
===================================================== */

function listen() {

  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Recognition) {

    answer(
      "El reconocimiento de voz no está disponible en este navegador, señor."
    );

    return;

  }

  const recognition =
    new Recognition();

  recognition.lang =
    "es-MX";

  recognition.continuous =
    false;

  recognition.interimResults =
    false;

  status(
    "ESCUCHANDO..."
  );

  show(
    "Lo escucho, señor."
  );

  recognition.start();

  recognition.onresult =
    function(event) {

      const command =
        event
          .results[0][0]
          .transcript;

      status(
        "PROCESANDO..."
      );

      const response =
        respond(command);

      addHistory(
        command,
        response
      );

      answer(
        response
      );

      showHistory();

    };


  recognition.onerror =
    function() {

      status(
        "SYSTEM ONLINE"
      );

      answer(
        "No he podido escucharlo, señor. Inténtelo nuevamente."
      );

    };

}


/* =====================================================
   ACTIVACIÓN
===================================================== */

function activate() {

  status(
    "SYSTEM ONLINE"
  );

  const message =
    "Sistema activado, señor. " +
    "Todos los módulos están operativos. " +
    "Estoy a su servicio.";

  answer(
    message
  );

}


/* =====================================================
   VOCES
===================================================== */

speechSynthesis.onvoiceschanged =
  function() {

    speechSynthesis.getVoices();

  };


/* =====================================================
   INICIO
===================================================== */

showSkills();

showHistory();

</script>
